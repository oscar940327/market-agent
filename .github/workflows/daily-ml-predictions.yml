name: Daily ML Predictions

permissions:
  contents: read
  actions: read
  issues: write

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Optional comma-separated tickers, for example MU,NVDA,AAPL."
        required: false
        default: ""
      limit:
        description: "Optional ticker limit for manual test runs."
        required: false
        default: ""
      dry_run:
        description: "Build records without writing to Supabase."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_freshness:
        description: "Skip per-ticker freshness checks for faster manual tests."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # Runs after prices/news/outcomes, using the latest Supabase data.
    # GitHub cron is UTC and does not adjust for US daylight saving time.
    - cron: "30 1 * * 2-6"

jobs:
  daily-ml-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ALERT_EMAIL_ENABLED: ${{ secrets.ALERT_EMAIL_ENABLED }}
      ALERT_EMAIL_PROVIDER: gmail
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Supabase access
        run: python scripts/check_supabase_access.py

      - name: Restore latest weekly ML dataset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/ml
          RUN_ID=$(gh run list \
            --workflow weekly-ml-dataset.yml \
            --branch "${GITHUB_REF_NAME}" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "No successful weekly ML dataset workflow was found."
            exit 1
          fi
          rm -rf data/ml/weekly-artifact
          gh run download "$RUN_ID" \
            --name weekly-ml-training-dataset \
            --dir data/ml/weekly-artifact
          CSV_PATH=$(find data/ml/weekly-artifact -name training_dataset_v1.csv -print -quit)
          METADATA_PATH=$(find data/ml/weekly-artifact -name training_dataset_v1_metadata.json -print -quit)
          if [ -z "$CSV_PATH" ] || [ -z "$METADATA_PATH" ]; then
            echo "The weekly ML dataset artifact is incomplete."
            exit 1
          fi
          cp "$CSV_PATH" data/ml/training_dataset_v1.csv
          cp "$METADATA_PATH" data/ml/training_dataset_v1_metadata.json

      - name: Refresh recent ML dataset rows
        run: python scripts/refresh_ml_training_dataset.py --window-days 140

      - name: Build similar-case accumulation
        run: python scripts/build_similar_case_results.py

      - name: Run daily ML predictions
        shell: bash
        run: |
          ARGS=()

          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            ARGS+=(--tickers "${{ github.event.inputs.tickers }}")
          fi

          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS+=(--limit "${{ github.event.inputs.limit }}")
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          if [ "${{ github.event.inputs.skip_freshness }}" = "true" ]; then
            ARGS+=(--skip-freshness)
          fi

          python scripts/build_daily_ml_predictions.py "${ARGS[@]}"

      - name: Build maintenance diagnosis
        if: always()
        uses: ./.github/actions/pipeline-diagnosis
        with:
          pipeline: daily-ml-predictions
          status: ${{ job.status }}
          input-paths: data/maintenance/supabase_preflight.json,data/ml/training_dataset_v1_metadata.json,data/ml/monitoring/similar_case_accumulation_v1.json

      - name: Send failure alert
        if: failure()
        run: >
          python scripts/send_pipeline_alert.py
          --pipeline daily-ml-predictions
          --status failed
          --message "Daily ML predictions GitHub Actions workflow failed."

      - name: Upload ML dataset artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-ml-prediction-dataset
          path: |
            data/ml/training_dataset_v1.csv
            data/ml/training_dataset_v1_metadata.json
            data/ml/monitoring/similar_case_accumulation_v1.json
            data/ml/monitoring/similar_case_accumulation_summary_v1.md
            data/maintenance/diagnoses/*
          if-no-files-found: ignore
