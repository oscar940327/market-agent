name: Weekly ML Dataset Build

permissions:
  contents: read
  actions: read
  issues: write

on:
  workflow_dispatch:
  schedule:
    # Sunday UTC. Builds a fresh dataset artifact without replacing model files.
    - cron: "0 5 * * 0"

jobs:
  weekly-ml-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ALERT_EMAIL_ENABLED: ${{ secrets.ALERT_EMAIL_ENABLED }}
      ALERT_EMAIL_PROVIDER: gmail
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Supabase access
        run: python scripts/check_supabase_access.py

      - name: Restore previous weekly ML dataset
        id: restore_dataset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/ml
          RUN_ID=$(gh run list \
            --workflow weekly-ml-dataset.yml \
            --branch "${GITHUB_REF_NAME}" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "No previous weekly dataset artifact found; bootstrap is required."
            exit 0
          fi

          rm -rf data/ml/weekly-artifact
          if ! gh run download "$RUN_ID" \
            --name weekly-ml-training-dataset \
            --dir data/ml/weekly-artifact; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "Previous dataset artifact could not be downloaded; bootstrap is required."
            exit 0
          fi

          CSV_PATH=$(find data/ml/weekly-artifact -name training_dataset_v1.csv -print -quit)
          METADATA_PATH=$(find data/ml/weekly-artifact -name training_dataset_v1_metadata.json -print -quit)
          if [ -z "$CSV_PATH" ] || [ -z "$METADATA_PATH" ]; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "Previous dataset artifact is incomplete; bootstrap is required."
            exit 0
          fi

          cp "$CSV_PATH" data/ml/training_dataset_v1.csv
          cp "$METADATA_PATH" data/ml/training_dataset_v1_metadata.json
          echo "restored=true" >> "$GITHUB_OUTPUT"

      - name: Bootstrap ML training dataset
        if: steps.restore_dataset.outputs.restored != 'true'
        run: python scripts/build_ml_training_dataset.py

      - name: Refresh recent ML dataset rows
        if: steps.restore_dataset.outputs.restored == 'true'
        run: python scripts/refresh_ml_training_dataset.py --window-days 140

      - name: Verify shared dataset metadata
        run: python scripts/check_freshness.py --scope ml_training --json

      - name: Build ML monitoring metrics
        run: python scripts/build_ml_monitoring_metrics.py --days 90 --model-version baseline_v1

      - name: Build ML calibration report
        run: python scripts/build_ml_calibration_report.py --days 90 --model-version baseline_v1

      - name: Build ML drift report
        run: python scripts/build_ml_drift_report.py --recent-days 30 --baseline-days 365

      - name: Build ML model upgrade review
        run: python scripts/build_ml_model_upgrade_review.py --send-alert

      - name: Build ML health report
        run: python scripts/build_ml_health_report.py --send-alert

      - name: Build maintenance diagnosis
        if: always()
        uses: ./.github/actions/pipeline-diagnosis
        with:
          pipeline: weekly-ml-dataset
          status: ${{ job.status }}
          input-paths: data/maintenance/supabase_preflight.json,data/ml/monitoring/ml_health_report_v1.json,data/ml/monitoring/ml_drift_report_v1.json,data/maintenance/data_recovery/latest_data_recovery.json

      - name: Send failure alert
        if: failure()
        run: >
          python scripts/send_pipeline_alert.py
          --pipeline weekly-ml-dataset
          --status failed
          --message "Weekly ML dataset GitHub Actions workflow failed."

      - name: Upload ML dataset artifact
        uses: actions/upload-artifact@v7
        with:
          name: weekly-ml-training-dataset
          path: |
            data/ml/training_dataset_v1.csv
            data/ml/training_dataset_v1_metadata.json
          if-no-files-found: error

      - name: Upload monitoring reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-ml-monitoring-reports
          path: |
            data/ml/monitoring/*
            data/maintenance/data_recovery/*
            data/maintenance/diagnoses/*
          if-no-files-found: ignore
